<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="../css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-md-8 col-lg-5 col-xl-4">
                <div class="card border-0 shadow-lg rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold">Bem vindo!</h2>
                            <p class="text-secondary">Faça seu cadastro!</p>

                            <form>
                                <div class="mb-3">
                                    <div class="d-flex justify-content-between">
                                        <label class="form-label fw-semibold">Nome</label>
                                    </div>
                                    <input
                                    type="name"
                                    class="form-control form-control-lg"
                                    placeholder="Digite seu nome">
                                </div>

                                <div class="mb-3">
                                    <div class="d-flex justify-content-between">
                                        <label class="form-label fw-semibold">E-mail</label>
                                    </div>
                                    <input
                                    type="email"
                                    class="form-control form-control-lg"
                                    placeholder="Digite seu email">
                                </div>

                                 <div class="mb-3">
                                    <div class="d-flex justify-content-between">
                                        <label class="form-label fw-semibold">Senha</label>
                                    </div>
                                    <input
                                    type="password"
                                    class="form-control form-control-lg"
                                    placeholder="Digite a senha">
                                </div>

                                <div class="mb-3">
                                    <div class="d-flex justify-content-between">
                                        <label class="form-label fw-semibold">Confirme sua senha</label>
                                    </div>
                                    <input
                                    type="password"
                                    class="form-control form-control-lg"
                                    placeholder="Confirme sua senha">
                                </div>

                               
                                <button type="submit" class="btn btn-primary btn-lg w-100">Entrar</button>
                                <div class="mb-3 mt-3">
                                    <a href="../html/login.html" class="text-decoration-none">Já possui conta? Faça login</a>

                                </div>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
